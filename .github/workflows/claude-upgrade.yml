# Weekly toil removal: the release-engineer flow upgrades dependencies and opens a PR for a human to merge.
# Requires: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Weekly dependency upgrade

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 08:17 BRT
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow the instructions in .claude/commands/upgrade-deps.md with an empty scope.
            Use the release-engineer subagent. If nothing is outdated, finish without opening a PR.
          claude_args: |
            --allowedTools "Agent,Read,Edit,Write,Grep,Glob,WebFetch,Bash(mvn:*),Bash(git:*),Bash(gh pr create:*)"
