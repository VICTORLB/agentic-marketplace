spring:
  application:
    name: agentic-marketplace
  lifecycle:
    # Cloud Run sends SIGTERM and allows ~10s before SIGKILL.
    timeout-per-shutdown-phase: 8s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

marketplace:
  pubsub:
    topic: offer-events
    push:
      verify: false
